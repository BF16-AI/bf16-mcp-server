name: Publish Docker Image to GHCR

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/bf16-ai/bf16-mcp-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=0.1.1
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=bf16-mcp-server
            org.opencontainers.image.description=Official MCP server for bf16.ai (1M-context uncensored LLM API with strict ZDR)
            org.opencontainers.image.url=https://bf16.ai
            org.opencontainers.image.source=https://github.com/BF16-AI/bf16-mcp-server
            org.opencontainers.image.licenses=MIT
