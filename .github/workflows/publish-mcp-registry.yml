name: Publish to Official MCP Registry

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar -xz mcp-publisher
          chmod +x mcp-publisher
      - name: Authenticate via GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json to Official MCP Registry
        run: ./mcp-publisher publish
